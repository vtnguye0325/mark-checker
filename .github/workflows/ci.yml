name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend – Lint
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v4

      - name: Set up virtualenv
        run: |
          python3 -m venv backend/.venv
          backend/.venv/bin/pip install --quiet --upgrade pip
          backend/.venv/bin/pip install --quiet ruff

      - name: Lint
        run: backend/.venv/bin/ruff check backend/

      - name: Format check
        run: backend/.venv/bin/ruff format --check backend/

  backend-test:
    name: Backend – Unit Tests
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v4

      - name: Set up virtualenv
        run: |
          python3 -m venv backend/.venv
          backend/.venv/bin/pip install --quiet --upgrade pip pip-tools
          backend/.venv/bin/pip install --quiet -r backend/requirements.lock httpx pytest pytest-asyncio

      - name: Run tests
        run: backend/.venv/bin/pytest tests/ -v
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  frontend-build:
    name: Frontend – Build
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, local]
    needs: [backend-lint, backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      HF_MODEL_ID: ${{ secrets.HF_MODEL_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - name: Sync code to production directory
        run: |
          cd /opt/mark-checker
          git fetch origin main
          git reset --hard origin/main

      - name: Build images
        working-directory: /opt/mark-checker
        run: docker compose build

      # Release the published ports before the new stack claims them. Without
      # this step a container left over from an earlier deploy keeps the port
      # and "up" fails with "port is already allocated".
      - name: Stop the running stack
        working-directory: /opt/mark-checker
        run: docker compose down --remove-orphans

      - name: Deploy
        working-directory: /opt/mark-checker
        run: docker compose up -d --remove-orphans

      # Read the health state from "docker inspect", not from
      # "docker compose ps --format json". Compose emits either one JSON object
      # per line or a single JSON array, and the format depends on the version.
      - name: Wait for healthy
        working-directory: /opt/mark-checker
        run: |
          echo "Waiting for backend to be healthy..."
          CID=$(docker compose ps -q backend)
          if [ -z "$CID" ]; then
            echo "The backend container does not exist"
            docker compose ps
            exit 1
          fi
          for i in $(seq 1 24); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' "$CID" 2>/dev/null || echo "unknown")
            echo "  attempt $i: $STATUS"
            [ "$STATUS" = "healthy" ] && exit 0
            sleep 5
          done
          echo "Backend did not become healthy in time"
          docker compose logs backend --tail 50
          exit 1
  